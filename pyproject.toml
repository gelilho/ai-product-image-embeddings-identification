[project]
name = "ai-product-image-embeddings-identification"
version = "0.1.0"
description = "Internal product image identification system using embedding-based similarity search"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Angel", email = "angel@example.com" }]

dependencies = [
    "httpx>=0.27,<1.0",
    "loguru>=0.7,<1.0",
    "numpy>=1.26,<2.0",
    "open-clip-torch>=2.26,<3.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.2,<3.0",
    "pillow>=10.0,<12.0",
    "torch>=2.2,<2.3",
    "transformers>=4.40,<5.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2.0",
    "pandas-stubs>=2.2",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "respx>=0.21,<1.0",
    "ruff>=0.5,<1.0",
    "types-pillow>=10.0",
]

[project.scripts]
embedding-generation = "product_image_id.cli.main:run_embedding_generation"
identify = "product_image_id.cli.main:run_identify"
evaluate = "product_image_id.cli.main:run_evaluate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_image_id"]

# ---------------------------------------------------------------------------
# Ruff – lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["product_image_id"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=product_image_id",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["product_image_id"]
omit = [
    "tests/*",
    "src/product_image_id/cli/*",               # CLI is tested via integration/E2E
    "src/product_image_id/embeddings/marqo_backend.py",  # Requires model download
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "open_clip.*",
    "torch.*",
]
ignore_missing_imports = true
